<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- userSpaceOnUse: an objectBoundingBox gradient cannot paint the A's
         horizontal crossbar, whose bounding box has zero height -->
    <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="4" y1="2" x2="28" y2="30">
      <stop offset="0%" stop-color="#5fe9cd" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e35cf0" />
    </linearGradient>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="8" y1="10" x2="22" y2="22">
      <stop offset="0%" stop-color="#9adcff" />
      <stop offset="100%" stop-color="#c65cff" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="#0c0620" />
  <circle cx="16" cy="16" r="12.4" fill="none" stroke="url(#r)" stroke-width="1.9" />

  <!-- letterforms as geometry: no font dependency, crisp at 16px -->
  <g stroke="url(#t)" stroke-width="2.6" fill="none" stroke-linecap="square">
    <path d="M8.2 21.6 L12 10.6 L15.8 21.6" />
    <path d="M9.9 18.4 H14.1" stroke-width="2.1" />
  </g>
  <rect x="19.2" y="10.4" width="2.7" height="11.2" fill="url(#t)" />
</svg>
