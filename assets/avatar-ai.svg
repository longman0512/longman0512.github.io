<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="AI">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#150b31" />
      <stop offset="55%" stop-color="#0a0519" />
      <stop offset="100%" stop-color="#04010d" />
    </radialGradient>

    <!-- cyan (top-left) through white (top) to violet/magenta (bottom-right) -->
    <linearGradient id="ring" x1="14%" y1="8%" x2="86%" y2="94%">
      <stop offset="0%" stop-color="#5fe9cd" />
      <stop offset="20%" stop-color="#b9f4ff" />
      <stop offset="44%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#bd82fb" />
      <stop offset="100%" stop-color="#e35cf0" />
    </linearGradient>

    <linearGradient id="txt" x1="0%" y1="10%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#9adcff" />
      <stop offset="42%" stop-color="#7bb4ff" />
      <stop offset="100%" stop-color="#c65cff" />
    </linearGradient>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="haze" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" />
    </filter>

    <!-- gentler than #glow so the A's counter stays open -->
    <filter id="glowText" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".30" />
      <stop offset="70%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="reflect">
      <rect x="0" y="228" width="320" height="92" fill="url(#fade)" />
    </mask>

    <!-- the mark: glowing ring + AI lettering, drawn as geometry so it needs no font -->
    <g id="mark">
      <circle cx="160" cy="148" r="79" fill="none" stroke="url(#ring)" stroke-width="17"
              opacity=".45" filter="url(#haze)" />
      <circle cx="160" cy="148" r="79" fill="none" stroke="url(#ring)" stroke-width="6.5"
              filter="url(#glow)" />
      <g filter="url(#glowText)">
        <path d="M120 180 L147 116 L174 180" fill="none" stroke="url(#txt)" stroke-width="16"
              stroke-linecap="square" stroke-linejoin="miter" />
        <path d="M129 160 H165" fill="none" stroke="url(#txt)" stroke-width="12"
              stroke-linecap="butt" />
        <rect x="187" y="115" width="15" height="65" fill="url(#txt)" />
      </g>
    </g>
  </defs>

  <rect width="320" height="320" fill="url(#bg)" />
  <use href="#mark" />
  <!-- mirrored, fading reflection along the bottom edge -->
  <g mask="url(#reflect)" transform="translate(0 476) scale(1 -1)">
    <use href="#mark" />
  </g>
</svg>
